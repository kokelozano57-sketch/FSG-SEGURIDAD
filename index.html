<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reloj Digital en Múltiples Zonas Horarias - Visualiza la hora en diferentes ciudades del mundo">
    <title>Reloj Digital - Múltiples Zonas Horarias</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <h1><i class="fas fa-clock"></i> Reloj Digital Global</h1>
            <p>Visualiza la hora en diferentes zonas horarias del mundo</p>
        </header>

        <!-- CONTROLES -->
        <div class="controls">
            <input type="text" id="searchCity" placeholder="Buscar ciudad..." class="search-input">
            <select id="timeFormat" class="format-select">
                <option value="24">Formato 24h</option>
                <option value="12">Formato 12h (AM/PM)</option>
            </select>
            <button id="addCityBtn" class="btn-add"><i class="fas fa-plus"></i> Agregar Ciudad</button>
        </div>

        <!-- MODAL PARA AGREGAR CIUDAD -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Agregar Nueva Ciudad</h2>
                <input type="text" id="cityInput" placeholder="Ej: Nueva York, Tokio, Londres..." class="city-input">
                <p class="city-suggestions" id="citySuggestions"></p>
                <button id="confirmAddCity" class="btn-confirm">Agregar</button>
            </div>
        </div>

        <!-- RELOJ PRINCIPAL -->
        <div class="main-clock">
            <div class="clock-display">
                <div class="time-large" id="mainTime">00:00:00</div>
                <div class="date-large" id="mainDate">Lunes, 1 de Enero</div>
                <div class="timezone-large" id="mainTimezone">Zona Horaria Local</div>
            </div>
        </div>

        <!-- RELOJES DE CIUDADES -->
        <div class="clocks-grid" id="clocksGrid">
            <!-- Se generan dinámicamente con JavaScript -->
        </div>

        <!-- INFORMACIÓN -->
        <div class="info-section">
            <h2>Zonas Horarias Disponibles</h2>
            <div class="timezone-info" id="timezoneInfo"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
